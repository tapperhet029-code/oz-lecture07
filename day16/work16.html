<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실습 02 — Todo List 만들기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>오늘의 할 일</h1>
    <form id="age" class="age-form">
      <input id="age" type="number" maxlength="20" placeholder="할 일을 입력하고 Enter">
      <button type="submit">추가</button>
    </form>
    <p id="todo-msg" class="msg error"></p>
    <ul id="todo-list" class="todo-list"></ul>
    <p id="todo-count">남은 일 0개</p>
  </main>

  <script src="work16.js"></script>
</body>
</html>
